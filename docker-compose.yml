services:
  postgres:
    # 基于固定 digest 的官方 postgres:16-alpine，构建时 apk upgrade（见 docker/postgres/Dockerfile）。
    build: ./docker/postgres
    image: artex-postgres:local
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  artex:
    # 从本仓库源码构建（见 Dockerfile），不拉取任何预编译 ARTEX 镜像。
    # 2026-11 发现预编译镜像 tomicdd/artex 内置免认证命令执行后门，源码中没有。
    build:
      context: .
      args:
        ARTEX_VERSION: ${ARTEX_VERSION:-dev}
    image: artex:local
    # 以宿主机当前用户的 UID 运行（install.sh 会写入 .env），这样绑定挂载的
    # ./data 与 ./skills 在宿主机上仍归你所有、容器内也可写。组固定为 0，
    # 镜像里 /app 对 0 组可写。缺省 10001 是镜像内置的 artex 用户。
    user: "${ARTEX_UID:-10001}:0"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEX_PG_DSN: postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artex}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
    ports:
      # 只发布到宿主机回环地址。需要远程访问时，请放在带认证与 TLS 的反向代理后面，
      # 不要直接改成 0.0.0.0——登录 ARTEX 即等于在容器里执行任意命令。
      - "127.0.0.1:8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # 数据目录（SQLite 等）与 skills 绑定到项目目录，方便在宿主机查看/备份/编辑。
      - ./data:/app/data
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
